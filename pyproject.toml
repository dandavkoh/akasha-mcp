[project]
name = "akasha-mcp"
version = "0.0.19"
description = "A simple MCP-to-OpenAPI proxy server with embedded mcp"
authors = [
    { name = "Daniel Kohsyk", email = "daniel.kohsyk@web.de" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # core proxy and mcp server
    "fastapi>=0.111.0,<0.120.0",
    "uvicorn[standard]>=0.23.0,<1.0.0",
    "pydantic>=2.3,<3.0",
    "python-multipart>=0.0.6",
    "mcp>=0.4.0",

    # AI / ML runtime
    "torch>=2.1",
    "sentence-transformers>=2.2.2",
    "tokenizers>=0.15",
    "accelerate>=0.28",

    # LangChain ecosystem
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.30",
    "langchain-chroma>=0.1.0",
    "langchain-text-splitters>=0.0.1",

    # Vector DB
    "chromadb>=0.4.0",

    # Document parsing
    "docling>=0.1.0",

    # Utilities
    "tqdm>=4.66",

    # Debug
    "debugpy>=1.6.7",
]

[project.scripts]
index-chroma = "akasha_mcp.chroma_index.index_nas:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/akasha_mcp",
    "src/mcp_openapi_proxy"
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.23.0",
]
